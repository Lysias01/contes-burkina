<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bibliothèque — Contes du Faso</title>
  <meta name="description" content="Tous les contes, légendes et récits historiques du Burkina Faso réunis par le groupe 6.">
  <meta name="theme-color" content="#1d2251">
  <link rel="icon" href="assets/icones/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <!-- Aperçu lors d'un partage (WhatsApp, réseaux sociaux) : adresses absolues obligatoires -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Contes du Faso">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Bibliothèque — Contes du Faso">
  <meta property="og:description" content="Tous les contes, légendes et récits historiques du Burkina Faso réunis par le groupe 6.">
  <meta property="og:url" content="https://lysias01.github.io/contes-burkina/bibliotheque.html">
  <meta property="og:image" content="https://lysias01.github.io/contes-burkina/assets/images/partage.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Une veillée sous le baobab : un conteur et deux enfants autour du feu, sous la lune.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/bibliotheque.css">
</head>
<body>
  <header id="entete"></header>

  <main class="conteneur">
    <div class="tete-page">
      <h1>La bibliothèque</h1>
      <p>Tous les récits recueillis, des contes de veillée aux grandes figures de notre histoire.</p>
    </div>

    <form class="recherche" role="search" onsubmit="return false">
      <label class="visuellement-cache" for="recherche">Rechercher un récit</label>
      <input class="champ" type="search" id="recherche" placeholder="Rechercher un titre, une ville, un peuple">
      <div class="onglets" role="group" aria-label="Filtrer par type">
        <button type="button" class="onglet" data-type="" aria-pressed="true">Tous</button>
        <button type="button" class="onglet" data-type="conte" aria-pressed="false">Contes</button>
        <button type="button" class="onglet" data-type="legende" aria-pressed="false">Légendes</button>
        <button type="button" class="onglet" data-type="historique" aria-pressed="false">Récits historiques</button>
      </div>
    </form>

    <p class="compteur" id="compteur" aria-live="polite"></p>
    <ul class="grille" id="grille"></ul>
  </main>

  <footer id="pied"></footer>

  <script src="js/app.js"></script>
  <script src="js/bibliotheque.js"></script>
</body>
</html>
