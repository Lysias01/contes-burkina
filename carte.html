<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carte des récits — Contes du Faso</title>
  <meta name="description" content="Carte interactive 2D/3D des contes, légendes et récits historiques du Burkina Faso.">
  <meta name="theme-color" content="#1d2251">
  <link rel="icon" href="assets/icones/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
  <!-- Aperçu lors d'un partage (WhatsApp, réseaux sociaux) : adresses absolues obligatoires -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Contes du Faso">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Carte des récits — Contes du Faso">
  <meta property="og:description" content="Carte interactive 2D/3D des contes, légendes et récits historiques du Burkina Faso.">
  <meta property="og:url" content="https://lysias01.github.io/contes-burkina/carte.html">
  <meta property="og:image" content="https://lysias01.github.io/contes-burkina/assets/images/partage.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Une veillée sous le baobab : un conteur et deux enfants autour du feu, sous la lune.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/carte.css">
</head>
<body class="page-carte">
  <header id="entete"></header>

  <main class="disposition-carte">
    <aside class="panneau" aria-label="Récits et filtres">
      <h1>La carte des récits</h1>
      <p class="aide">Touchez un point pour découvrir le récit qui y est né.</p>

      <fieldset class="filtres">
        <legend>Type de récit</legend>
        <label><input type="checkbox" name="type" value="conte" checked> <span class="type" data-type="conte">Contes</span></label>
        <label><input type="checkbox" name="type" value="legende" checked> <span class="type" data-type="legende">Légendes</span></label>
        <label><input type="checkbox" name="type" value="historique" checked> <span class="type" data-type="historique">Récits historiques</span></label>
      </fieldset>

      <label class="filtre-langue">
        <span>Langue</span>
        <select class="champ" id="filtre-langue">
          <option value="">Toutes les langues</option>
        </select>
      </label>

      <ul class="liste-recits" id="liste-recits" aria-live="polite"></ul>
    </aside>

    <section class="zone-carte" aria-label="Carte du Burkina Faso">
      <div id="carte"></div>
      <button class="bouton bascule-3d" id="bascule-3d" aria-pressed="false">Passer en vue 3D</button>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
  <script src="js/carte.js"></script>
</body>
</html>
