<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carte des récits — Contes du Faso</title>
  <meta name="description" content="Carte interactive 2D/3D des contes, légendes et récits historiques du Burkina Faso.">
  <link rel="icon" href="assets/icones/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/conte.css">
  <link rel="stylesheet" href="css/carte.css">
</head>
<body class="page-carte">
  <header id="entete"></header>

  <main class="disposition-carte">
    <aside class="panneau" aria-label="Liste des récits">
      <div class="panneau-tete">
        <h1>La carte des récits</h1>
        <p class="aide">Dix arbres à palabres vous attendent sur le Faso. Choisissez-en un pour découvrir le récit qui s'y raconte.</p>
        <div class="legende-arbres" role="list" aria-label="Couleur des arbres">
          <span class="type" data-type="conte" role="listitem">Contes</span>
          <span class="type" data-type="legende" role="listitem">Légendes</span>
          <span class="type" data-type="historique" role="listitem">Récits historiques</span>
        </div>
      </div>

      <ul class="liste-recits" id="liste-recits"></ul>
    </aside>

    <section class="zone-carte" aria-label="Carte du Burkina Faso">
      <div id="carte"></div>
      <button class="bouton bascule-3d" id="bascule-3d" aria-pressed="true">Passer en vue 2D</button>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
  <script src="js/carte.js"></script>
</body>
</html>
